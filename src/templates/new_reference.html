{% extends "layout.html" %} {% block title %}New reference{% endblock %}
{% block body %}
    <h2>Create a new reference</h2>

    {% for message in get_flashed_messages() %}
        <p>{{ message }}</p>
    {% endfor %}

    <form action="/create-reference" method="post">
        <input type="hidden" id="type" name="type" value="book" />
        <label for="key">Citation key:</label>
        <input type="text" id="key" name="key" value="{{ values.get('key', '') }}" required />
        <br />
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" value="{{ values.get('title', '') }}" maxlength="200" required />
        <br />
        <label for="author">Author:</label>
        <input type="text" id="author" name="author" value="{{ values.get('author', '') }}" required />
        <br />
        <label for="publisher">Publisher:</label>
        <input type="text" id="publisher" name="publisher" value="{{ values.get('publisher', '') }}" maxlength="100" />
        <br />
        <label for="year">Year:</label>
        <input type="number" id="year" name="year" value="{{ values.get('year', '') }}" maxlength="4" required />
        <br />
        <button type="submit">Create</button>
    </form>
{% endblock %}
