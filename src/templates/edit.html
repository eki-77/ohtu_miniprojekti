<!DOCTYPE html>
<html>

<head>
    <title>
        Editing reference #
    </title>
</head>

<body>
    <main>

        {% for message in get_flashed_messages() %}
            <p> {{message}} </p>
        {% endfor %}

        <form action="/edit/{{reference.id}}" method="post">

            <input type="hidden" id="type" name="type" value="{{reference.cite_type}}">

            <label for="key">Citation key:</label>
            <textarea type="text" id="key" name="key" required>{{reference.citation_key}}</textarea>
            <br />

            <label for="title">Title:</label>
            <textarea type="text" id="title" name="title" required>{{reference.title}}</textarea>
            <br />

            <label for="author">Author:</label>
            <textarea type="text" id="author" name="author" required>{{reference.author}}</textarea>
            <br />

            <label for="publisher">Publisher:</label>
            <textarea type="text" id="publisher" name="publisher">{{reference.publisher}}</textarea>
            <br />

            <label for="year">Year:</label>
            <input type="number" id="year" name="year" value="{{ reference.year }}" required>
            <br />

            <button type="submit">Proceed with changes</button>

        </form>
    </main>
</body>

</html>
