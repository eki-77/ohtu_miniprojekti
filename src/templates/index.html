<!DOCTYPE html>
<html>

<head>
    <title>Miniproject</title>
</head>

<body>

    <h1>Miniproject</h1>

    {% for message in get_flashed_messages() %}
        <p> {{message}} </p>
    {% endfor %}

    <a href="/new-reference">Create a new reference</a> <br>

    <p>
    Current references count: {{count}}. Click to edit. <br> 
    </p>

    <p>
    {% for reference in references %}
        <a href="/edit/{{reference.id}}" style="text-decoration:none;color:black" >
        {{reference.author}}. <em>{{reference.title}}</em>. {{reference.publisher}}, {{reference.year}} 
        </a>
        <br>
    {% endfor %}
    </p>

</body>

</html>
