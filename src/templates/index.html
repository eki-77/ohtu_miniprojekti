<!DOCTYPE html>
<html>

<head>
    <title>Miniproject</title>
</head>

<body>

    <h1>Miniproject</h1>

    {% for message in get_flashed_messages() %}
        <p> {{message}} </p>
    {% endfor %}

    <a href="new-reference">Create a new reference</a> <br>

    <p>
    Current references count: {{count}} <br> 
    </p>

    <p>
    {% for reference in references %}
        {{reference.author}}. <em>{{reference.title}}</em>. {{reference.publisher}}, {{reference.year}} <br>
    {% endfor %}
    </p>

</body>

</html>
