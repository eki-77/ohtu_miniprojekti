{% extends "layout.html" %} {% block title %}New article reference{% endblock %}
{% block body %}
    <h2>Create a new article reference</h2>

    {% for message in get_flashed_messages() %}
        <p>{{ message }}</p>
    {% endfor %}

    <form action="/create-reference" method="post">
        <input type="hidden" id="type" name="type" value="article" />
        <label for="key">Citation key:</label>
        <input type="text" id="key" name="key" required />
        <br />
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" maxlength="200" required />
        <br />
        <label for="author">Author:</label>
        <input type="text" id="author" name="author" required />
        <br />
        <!--
        <label for="publisher">Publisher:</label>
        <input type="text" id="publisher" name="publisher" maxlength="100" />
        <br />-->
        <label for="journal">Journal:</label>
        <input type="text" id="journal" name="journal" required />
        <br />
        <label for="year">Year:</label>
        <input type="number" id="year" name="year" maxlength="4" required />
        <br />
        <label for="volume">Volume:</label>
        <input type="text" id="volume" name="volume" />
        <br />
        <label for="number">Number:</label>
        <input type="text" id="number" name="number" />
        <br />
        <button type="submit">Create</button>
    </form>
{% endblock %}
